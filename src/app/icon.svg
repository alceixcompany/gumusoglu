<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Gümüşoğlu Elektrik</title>
  <defs>
    <linearGradient id="brand" x1="10" y1="8" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1c2d49"/>
      <stop offset="0.58" stop-color="#347bb7"/>
      <stop offset="1" stop-color="#45a0a0"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#brand)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2"/>

